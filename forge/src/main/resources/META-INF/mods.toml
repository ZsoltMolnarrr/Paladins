modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "https://github.com/ZsoltMolnarrr/Paladins/issues"
license = "All Rights Reserved"

[[mods]]
modId = "paladins"
version = "${version}"
displayName = "Paladins & Priests (RPG Series)"
authors = "Daedelus"
description = '''
Protect and heal your friends as a Paladin or a Priest.
'''
logoFile = "icon.png"

[[dependencies.paladins]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.paladins]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.paladins]]
modId = "armor_model_api"
mandatory = true
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.paladins]]
modId = "spell_engine"
mandatory = true
versionRange = "[1.10.5,)"
ordering = "AFTER"
side = "BOTH"

# Kite shields are `net.fabric_extras.shield_api.item.CustomShieldItem` instances (see PaladinShields).
[[dependencies.paladins]]
modId = "shield_api"
mandatory = true
versionRange = "[2.2.0,)"
ordering = "AFTER"
side = "BOTH"

# Runes is optional. Paladins does not compile against it — the monk-merchant
# rune trade and the rune drops in monk-sanctuary chests are resolved by registry id / tag and simply
# stay inert when it is absent.
[[dependencies.paladins]]
modId = "runes"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# StructurePoolAPI injects the monk sanctuary into the *vanilla* village pools. Since 1.2.1 it has a
# Forge artifact, so this is a hard dependency on both loaders (mirrors the `fabric.mod.json` entry).
[[dependencies.paladins]]
modId = "structure_pool_api"
mandatory = true
versionRange = "[1.2.1,)"
ordering = "NONE"
side = "BOTH"

# Mixin configs are declared in the jar MANIFEST (`MixinConfigs:`) by Loom (`loom.forge.mixinConfig`),
# not in this file — the `[[mixins]]` table is NeoForge-only.
