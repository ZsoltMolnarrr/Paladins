architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url = 'https://repo.redlance.org/public' } // PAL (Player Animation Library)
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    implementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
    implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")
    implementation("maven.modrinth:armor-model-api:${project.armor_model_api_version}-${platform}")
    implementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    // TODO 26.3: SpellEngine back to maven.modrinth once released for 26.3.
    implementation("maven.modrinth:runes:${project.runes_version}-${platform}")
    implementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    // The Modrinth artifact has no pom, so nothing is transitive. On the mavenLocal line
    // below, `transitive = false` is required: the local-maven pom drags in Cardinal Components, whose Loom-injected
    // interfaces on `Entity` then fail to resolve here. Everything SpellEngine needs is declared above.
//    implementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    implementation("net.spell_engine:spell_engine-${platform}:${project.spell_engine_version}") { transitive = false }

    // Compatibility
    // Fabric specific
}
